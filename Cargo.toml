[package]
name = "marspeak"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "中文火星文转换库：可逆的字形替换，支持强度档位与确定性随机"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Natane0808/marspeak"
homepage = "https://github.com/Natane0808/marspeak"
documentation = "https://docs.rs/marspeak"
keywords = ["chinese", "text", "converter", "unicode", "martian"]
categories = ["text-processing", "internationalization"]

[features]
default = ["std"]
std = ["phf/std"]

[dependencies]
phf = { version = "0.11", default-features = false }

[build-dependencies]
phf_codegen = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "glyph"
harness = false
